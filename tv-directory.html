<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TV Directory</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ffffff;
        }
        #searchBar {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 16px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .tab-button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #9e9e9e;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: background-color 0.2s, color 0.2s;
        }
        .tab-button:hover {
            background-color: #3a3a3a;
        }
        .tab-button.active {
            background-color: #3700b3;
            color: #ffffff;
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .channel-item {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .channel-item:hover {
            background-color: #2a2a2a;
            transform: translateY(-3px);
        }
        .channel-logo {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 10px;
            background-color: #333;
        }
        .channel-name {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
        }
        #status {
            text-align: center;
            color: #f44336;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.1em;
        }
        #content-area {
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>My TV Directory</h1>
        </div>
        
        <div id="status">Loading playlist...</div>
        
        <div id="content-area">
            <input type="text" id="searchBar" placeholder="Search for a channel...">
            
            <div class="tabs" id="regionTabs">
                <!-- Region tabs will be dynamically inserted here -->
            </div>

            <div id="channelGrid" class="channel-grid"></div>
        </div>
    </div>

    <script>
        // Your M3U URL is hardcoded here
        const M3U_URL = "https://gist.githubusercontent.com/Onique-Unique/629ad24a2dc97881d167ecf24d2fe207/raw/a69fa107d0a97a64d8859baf452af72a208a73d9/playlist.m3u";

        const statusDiv = document.getElementById('status');
        const contentArea = document.getElementById('content-area');
        const searchBar = document.getElementById('searchBar');
        const channelGrid = document.getElementById('channelGrid');
        const regionTabsContainer = document.getElementById('regionTabs');
        
        let allChannels = [];
        let currentRegionFilter = 'all';

        // Main function to run when the page loads
        (async () => {
            try {
                statusDiv.textContent = 'Fetching playlist data...';
                const response = await fetch(M3U_URL);
                if (!response.ok) throw new Error(`Failed to fetch playlist: ${response.statusText}`);
                const m3uText = await response.text();
                
                allChannels = parseM3u(m3uText);
                if (allChannels.length === 0) {
                    throw new Error('No channels found in the playlist.');
                }

                setupFiltersAndTabs(allChannels);
                displayChannels(allChannels);
                
                contentArea.style.display = 'block';
                statusDiv.textContent = `Successfully loaded ${allChannels.length} channels!`;
                statusDiv.style.color = '#4caf50';

            } catch (error) {
                console.error('Error loading playlist:', error);
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.style.color = '#f44336';
                contentArea.style.display = 'none';
            }
        })();

        function parseM3u(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentChannel = {};
            for (const line of lines) {
                const trimmedLine = line.trim();
                if (trimmedLine.startsWith('#EXTINF:-1')) {
                    const nameMatch = trimmedLine.match(/,(.+)$/);
                    const logoMatch = trimmedLine.match(/tvg-logo="([^"]*)"/);
                    const groupMatch = trimmedLine.match(/group-title="([^"]*)"/);
                    
                    currentChannel = {
                        name: nameMatch ? nameMatch[1] : 'Unknown Channel',
                        logo: logoMatch ? logoMatch[1] : '',
                        group: groupMatch ? groupMatch[1] : 'Other'
                    };
                } else if (trimmedLine && !trimmedLine.startsWith('#') && currentChannel.name) {
                    currentChannel.url = trimmedLine;
                    channels.push({ ...currentChannel });
                    currentChannel = {};
                }
            }
            return channels;
        }
        
        function setupFiltersAndTabs(channels) {
            // Create "All Regions" tab
            const allTab = createTab('all', 'All Regions', true);
            regionTabsContainer.appendChild(allTab);

            // Find all unique regions and create a tab for each
            const uniqueRegions = [...new Set(channels.map(ch => ch.group))].sort();
            uniqueRegions.forEach(region => {
                const tab = createTab(region, region, false);
                regionTabsContainer.appendChild(tab);
            });

            // Setup search bar listener
            searchBar.addEventListener('input', applyFilters);
        }
        
        function createTab(filterValue, text, isActive) {
            const btn = document.createElement('div');
            btn.className = 'tab-button';
            if (isActive) btn.classList.add('active');
            btn.textContent = text;
            btn.dataset.region = filterValue;
            btn.addEventListener('click', () => {
                document.querySelectorAll('#regionTabs .tab-button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentRegionFilter = btn.dataset.region;
                applyFilters();
            });
            return btn;
        }

        function applyFilters() {
            const searchTerm = searchBar.value.toLowerCase();
            const filtered = allChannels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchTerm);
                const matchesRegion = currentRegionFilter === 'all' || channel.group === currentRegionFilter;
                return matchesSearch && matchesRegion;
            });
            displayChannels(filtered);
        }

        function displayChannels(channels) {
            channelGrid.innerHTML = ''; // Clear previous results
            channels.forEach(channel => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                
                const logo = document.createElement('img');
                logo.src = channel.logo;
                logo.alt = channel.name;
                logo.className = 'channel-logo';
                logo.onerror = () => logo.style.display = 'none'; // Hide broken images

                const name = document.createElement('div');
                name.className = 'channel-name';
                name.textContent = channel.name;

                item.appendChild(logo);
                item.appendChild(name);
                
                item.addEventListener('click', () => {
                    window.open(channel.url, '_blank');
                });
                
                channelGrid.appendChild(item);
            });
        }
    </script>
</body>
</html>
